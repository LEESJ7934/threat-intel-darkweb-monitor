{% extends "mongoDbConnect/base.html" %}
{% block title %}분석 화면 로그인{% endblock %}
{% block content %}
<section class="panel">
  <h1>분석 화면 로그인</h1>
  {% if form.errors %}<p role="alert">아이디 또는 비밀번호를 확인하세요.</p>{% endif %}
  <form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <p><label for="id_username">아이디</label>
    <input id="id_username" name="username" autocomplete="username" required autofocus></p>
    <p><label for="id_password">비밀번호</label>
    <input id="id_password" name="password" type="password" autocomplete="current-password" required></p>
    <button type="submit">로그인</button>
  </form>
</section>
{% endblock %}
